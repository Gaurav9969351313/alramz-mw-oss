openapi: 3.0.3

info:
  title: IBAN Validation API
  version: 1.0.0
  description: API to validate an IBAN and retrieve bank information.

servers:
  - url: http://localhost:8080

paths:
  /iban/validate:
    post:
      tags:
        - IBAN
      summary: Validate IBAN
      description: Validates an IBAN and returns bank details along with validation results.
      operationId: validateIBAN

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IBANRequest'
            example:
              IBAN: AE460260001015862843301

      responses:
        '200':
          description: IBAN validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                responseCode: "200"
                responseMessage: "OK"
                response:
                  bank_data:
                    countryISO3: ARE
                    bic: ADCBAEAAXXX
                    branch: null
                    bank: ABU DHABI COMMERCIAL BANK
                    address: ADCB BUILDING, SALAM STREET
                    city: ABU DHABI
                    state: null
                    zip: "939"
                    phone: null
                    fax: null
                    www: null
                    email: null
                    country: United Arab Emirates
                    country_iso: AE
                    account: "0012552369920001"
                    bank_code: "003"
                    branch_code: ""
                  validations:
                    chars:
                      code: "006"
                      message: IBAN does not contain illegal characters
                    account:
                      code: "004"
                      message: Account Number check digit is not performed for this bank or branch
                    iban:
                      code: "001"
                      message: IBAN Check digit is correct
                    structure:
                      code: "005"
                      message: IBAN structure is correct
                    length:
                      code: "003"
                      message: IBAN Length is correct
                    country_support:
                      code: "007"
                      message: Country supports IBAN standard

        '400':
          description: Invalid request

        '500':
          description: Internal server error

  /veriphone/verify:
    post:
      tags:
        - VeriPhone
      summary: Verify phone number
      description: Validates a phone number and returns phone metadata.
      operationId: verifyPhone

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
            example:
              phone: "971502540238"
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                responseCode: "200"
                responseMessage: "OK"
                response:
                  status: success
                  phone: "971502540238"
                  phone_valid: true
                  phone_type: mobile
                  phone_region: United Arab Emirates
                  country: United Arab Emirates
                  country_code: AE
                  country_prefix: "971"
                  international_number: "971502540238"
                  local_number: "0502540238"
                  e164: "971502540238"
                  carrier: du

        '400':
          description: Invalid request

        '500':
          description: Internal server error

  /existing-data/validation:
    post:
      tags:
        - ExistingData
      summary: Validate existing data
      description: Checks if an email, passport, NIN, username, EID, third-party UUID, or mobile number exists in the external system.
      operationId: validateExistingData

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
            examples:
              email:
                summary: Email exists validation
                value:
                  validationType: "EMAIL_EXISTS"
                  referenceNo: "1"
                  email: "solattupuram@alramz.ae"
                  language: "EN"
                  islamicMode: "Y"
              passport:
                summary: Passport exists validation
                value:
                  validationType: "PASSPORT_EXISTS"
                  referenceNo: "100"
                  passportNumber: "XY1152302"
                  language: "EN"
                  islamicMode: "Y"
              nin:
                summary: NIN exists validation
                value:
                  validationType: "NIN_EXISTS"
                  referenceNo: "200"
                  nin: "1234567890"
                  language: "EN"
                  islamicMode: "Y"
              username:
                summary: Username exists validation
                value:
                  validationType: "USERNAME_EXISTS"
                  referenceNo: "300"
                  username: "yasser1"
                  language: "EN"
                  islamicMode: "Y"
              eid:
                summary: EID exists validation
                value:
                  validationType: "EID_EXISTS"
                  referenceNo: "400"
                  eidNumber: "784-1989-0751424-8"
                  language: "EN"
                  islamicMode: "Y"
              tp_uuid:
                summary: Third-party UUID exists validation
                value:
                  validationType: "TP_UUID_EXISTS"
                  referenceNo: "500"
                  uuid: "101296594260088743321545352540"
                  thirdParty: "Google"
                  language: "EN"
                  islamicMode: "Y"
              mobile:
                summary: Mobile number exists validation
                value:
                  validationType: "MOBILE_EXISTS"
                  referenceNo: "600"
                  mobileNumber: "971502573881"

      responses:
        '200':
          description: Validation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                responseCode: "200"
                responseMessage: "OK"
                response:
                  validationType: "EMAIL_EXISTS"
                  exists: true
                  valid: true
                  message: "Email already exists"
                  referenceNo: "1"

        '400':
          description: Invalid request

        '500':
          description: Internal server error

components:
  schemas:
    IBANRequest:
      type: object
      required:
        - IBAN
      properties:
        IBAN:
          type: string
          description: International Bank Account Number
          minLength: 1
          maxLength: 30
          example: AE460260001015862843301

    GenericResponse:
      type: object
      required:
        - responseCode
        - responseMessage
        - response
      properties:
        responseCode:
          type: string
          example: "200"

        responseMessage:
          type: string
          example: OK

        response:
          type: object

    IBANValidationResponse:
      type: object
      properties:
        bank_data:
          $ref: '#/components/schemas/BankData'
        sepa_data:
          $ref: '#/components/schemas/SepaData'
        validations:
          $ref: '#/components/schemas/Validations'
        errors:
          type: array
          items:
            type: object

    SepaData:
      type: object
      properties:
        SCT:
          type: string
          example: "NO"

        SDD:
          type: string
          example: "NO"

        COR1:
          type: string
          example: "NO"

        B2B:
          type: string
          example: "NO"

        SCC:
          type: string
          example: "NO"

    BankData:
      type: object
      properties:

        countryISO3:
          type: string
          example: ARE

        bic:
          type: string
          example: ADCBAEAAXXX

        branch:
          type: string
          nullable: true

        bank:
          type: string
          example: ABU DHABI COMMERCIAL BANK

        address:
          type: string
          example: ADCB BUILDING, SALAM STREET

        city:
          type: string
          example: ABU DHABI

        state:
          type: string
          nullable: true

        zip:
          type: string
          example: "939"

        phone:
          type: string
          nullable: true

        fax:
          type: string
          nullable: true

        www:
          type: string
          nullable: true

        email:
          type: string
          nullable: true

        country:
          type: string
          example: United Arab Emirates

        country_iso:
          type: string
          example: AE

        account:
          type: string
          example: "0012552369920001"

        bank_code:
          type: string
          example: "003"

        branch_code:
          type: string
          example: ""

    Validations:
      type: object
      properties:

        chars:
          $ref: '#/components/schemas/ValidationResult'

        account:
          $ref: '#/components/schemas/ValidationResult'

        iban:
          $ref: '#/components/schemas/ValidationResult'

        structure:
          $ref: '#/components/schemas/ValidationResult'

        length:
          $ref: '#/components/schemas/ValidationResult'

        country_support:
          $ref: '#/components/schemas/ValidationResult'

    ValidationResult:
      type: object
      properties:

        code:
          type: string
          example: "001"

        message:
          type: string
          example: IBAN Check digit is correct

    PhoneRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          minLength: 3
          maxLength: 15
          description: Phone number in international format without spaces.
          example: "971502540238"

    PhoneValidationResponse:
      type: object
      properties:
        status:
          type: string
          example: success

        phone:
          type: string
          example: "971502540238"

        phone_valid:
          type: boolean
          example: true

        phone_type:
          type: string
          example: mobile

        phone_region:
          type: string
          example: United Arab Emirates

        country:
          type: string
          example: United Arab Emirates

        country_code:
          type: string
          example: AE

        country_prefix:
          type: string
          example: "971"

        international_number:
          type: string
          example: "971502540238"

        local_number:
          type: string
          example: "0502540238"

        e164:
          type: string
          example: "971502540238"

        carrier:
          type: string
          example: du

    ValidationRequest:
      type: object
      required:
        - validationType
        - referenceNo
        - language
        - islamicMode
      properties:
        validationType:
          type: string
          enum: [EMAIL_EXISTS, PASSPORT_EXISTS, NIN_EXISTS, USERNAME_EXISTS, EID_EXISTS, TP_UUID_EXISTS, MOBILE_EXISTS]
          description: Type of validation to perform
        referenceNo:
          type: string
          description: Client reference number
        language:
          type: string
          example: "EN"
        islamicMode:
          type: string
          example: "Y"
        email:
          type: string
          format: email
          description: Email address to validate (required for EMAIL_EXISTS)
        passportNumber:
          type: string
          description: Passport number to validate (required for PASSPORT_EXISTS)
        emiratesId:
          type: string
          description: Emirates ID to validate (reserved for future)
        nin:
          type: string
          description: National ID to validate (required for NIN_EXISTS)
        username:
          type: string
          description: Username to validate (required for USERNAME_EXISTS)
        eidNumber:
          type: string
          description: Emirates ID number to validate (required for EID_EXISTS)
        uuid:
          type: string
          description: Third-party UUID to validate (required for TP_UUID_EXISTS)
        thirdParty:
          type: string
          description: Third-party provider name (required for TP_UUID_EXISTS)
        mobileNumber:
          type: string
          description: Mobile number to validate (required for MOBILE_EXISTS)

    ValidationResponse:
      type: object
      required:
        - validationType
        - exists
        - valid
        - message
        - referenceNo
      properties:
        validationType:
          type: string
        exists:
          type: boolean
        valid:
          type: boolean
        message:
          type: string
        referenceNo:
          type: string