spring:
  application:
    name: data-validation-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true

server:
  port: 5001
  
management:
  endpoints:
    web:
      exposure:
        include: "*"