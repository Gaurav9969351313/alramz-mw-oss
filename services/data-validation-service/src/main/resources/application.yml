spring:
  application:
    name: data-validation-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

sql:
  file: classpath:sql/sql-queries.xml

# Al Ramz logging starter: structured JSON logging with correlation-id +
# request/response logging enabled for every microservice.
company:
  logging:
    json:
      enabled: false
      pretty-print: true
    correlation-id:
      response-header: true
    request:
      enabled: true
      include-headers: true
      include-payload: true
      pretty-print: true
    response:
      enabled: true
      include-payload: true
      pretty-print: true
    aspect:
      enabled: true
    performance:
      threshold: 1000ms