spring:
  application:
    name: utility-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate

server:
  host: localhost

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    annotations:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false   # Jaeger accepts traces only
