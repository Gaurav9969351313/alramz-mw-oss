name: Terraform

on:
  # push:
  #   branches:
      # - dev
      # - qa
      # - preprod
      # - prod
      # - feature/cicd-rewrite
    # paths:
    #   - 'infra/**'
    #   - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - dev
      - qa
      - preprod
      - prod
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - shared-platform
          - dev
          - qa
          - preprod
          - prod
        default: shared-platform
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      run_shared_platform_first:
        description: Run shared-platform before environment deployment?
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write
  statuses: write

concurrency:
  group: terraform-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  detect-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      stack: ${{ steps.detect.outputs.stack }}
      is_shared_platform: ${{ steps.detect.outputs.is_shared_platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect environment
        id: detect
        shell: bash
        run: |
          ENVIRONMENTS="shared-platform dev qa preprod prod"
          DEFAULT_ENV="shared-platform"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_ENV="${{ inputs.environment }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            SELECTED_ENV="${{ github.base_ref }}"
          else
            SELECTED_ENV="${{ github.ref_name }}"
          fi

          # Validate against known environments, default to shared-platform
          if [[ ! " $ENVIRONMENTS " =~ " $SELECTED_ENV " ]]; then
            echo "Warning: '$SELECTED_ENV' is not a valid environment. Defaulting to '$DEFAULT_ENV'"
            SELECTED_ENV="$DEFAULT_ENV"
          fi

          # Check if shared-platform
          if [ "$SELECTED_ENV" = "shared-platform" ]; then
            echo "is_shared_platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_shared_platform=false" >> "$GITHUB_OUTPUT"
          fi

          echo "environment=$SELECTED_ENV" >> "$GITHUB_OUTPUT"
          echo "stack=$SELECTED_ENV" >> "$GITHUB_OUTPUT"
          echo "Detected environment: $SELECTED_ENV"

  # Shared Platform - runs first for shared infrastructure
  shared-platform-plan:
    needs: detect-environment
    if: needs.detect-environment.outputs.is_shared_platform == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan'))
    runs-on: ubuntu-latest
    environment: shared-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure Resource Providers
        shell: bash
        run: |
          echo "Registering required Azure resource providers..."
          providers=(
            "Microsoft.ContainerRegistry"
            "Microsoft.ContainerService"
            "Microsoft.KeyVault"
            "Microsoft.Cache"
            "Microsoft.DBforPostgreSQL"
            "Microsoft.ApiManagement"
            "Microsoft.OperationalInsights"
            "Microsoft.Network"
            "Microsoft.ManagedIdentity"
          )
          for provider in "${providers[@]}"; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --wait
          done
          echo "All providers registered."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Terraform Init
        working-directory: infra/stacks/shared-platform
        shell: bash
        run: |
          terraform init -input=false -no-color

      - name: Terraform Plan
        working-directory: infra/stacks/shared-platform
        shell: bash
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="../../environments/shared-platform.tfvars" \
            -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-shared-platform
          path: infra/stacks/shared-platform/tfplan
          retention-days: 7

  shared-platform-apply:
    needs: detect-environment
    if: needs.detect-environment.outputs.is_shared_platform == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: ubuntu-latest
    environment: shared-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure Resource Providers
        shell: bash
        run: |
          echo "Registering required Azure resource providers..."
          providers=(
            "Microsoft.ContainerRegistry"
            "Microsoft.ContainerService"
            "Microsoft.KeyVault"
            "Microsoft.Cache"
            "Microsoft.DBforPostgreSQL"
            "Microsoft.ApiManagement"
            "Microsoft.OperationalInsights"
            "Microsoft.Network"
            "Microsoft.ManagedIdentity"
          )
          for provider in "${providers[@]}"; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --wait
          done
          echo "All providers registered."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Terraform Init
        working-directory: infra/stacks/shared-platform
        shell: bash
        run: |
          terraform init -input=false -no-color

      - name: Terraform Plan
        working-directory: infra/stacks/shared-platform
        shell: bash
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="../../environments/shared-platform.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra/stacks/shared-platform
        shell: bash
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -auto-approve \
            tfplan

      - name: Capture Outputs
        id: outputs
        working-directory: infra/stacks/shared-platform
        shell: bash
        run: |
          OUTPUTS=$(terraform output -json | base64 -w 0)
          echo "outputs=$OUTPUTS" >> "$GITHUB_OUTPUT"

  # Environment deployments (dev, qa, preprod, prod)
  terraform-plan:
    needs: detect-environment
    if: needs.detect-environment.outputs.is_shared_platform == 'false' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan' && !inputs.run_shared_platform_first))
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure Resource Providers
        shell: bash
        run: |
          echo "Registering required Azure resource providers..."
          providers=(
            "Microsoft.ContainerRegistry"
            "Microsoft.ContainerService"
            "Microsoft.KeyVault"
            "Microsoft.Cache"
            "Microsoft.DBforPostgreSQL"
            "Microsoft.ApiManagement"
            "Microsoft.OperationalInsights"
            "Microsoft.Network"
            "Microsoft.ManagedIdentity"
          )
          for provider in "${providers[@]}"; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --wait
          done
          echo "All providers registered."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Terraform Init
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform init -input=false -no-color

      - name: Terraform Plan
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="../../environments/${{ needs.detect-environment.outputs.stack }}.tfvars" \
            -out=tfplan

      - name: Terraform Show Plan
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform show -no-color tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.detect-environment.outputs.stack }}
          path: infra/stacks/${{ needs.detect-environment.outputs.stack }}/tfplan
          retention-days: 7

      - name: Update PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = require('child_process')
              .execSync('terraform show -no-color tfplan', { 
                cwd: 'infra/stacks/${{ needs.detect-environment.outputs.stack }}' 
              })
              .toString();
            
            const body = `## Terraform Plan for \`${{ needs.detect-environment.outputs.stack }}\`
            
            \`\`\`
            ${planOutput.slice(0, 60000)}
            \`\`\`
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # Environment deployments with shared-platform first
  terraform-plan-with-shared:
    needs: [detect-environment, shared-platform-apply]
    if: needs.detect-environment.outputs.is_shared_platform == 'false' && github.event_name == 'workflow_dispatch' && inputs.action == 'plan' && inputs.run_shared_platform_first
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure Resource Providers
        shell: bash
        run: |
          echo "Registering required Azure resource providers..."
          providers=(
            "Microsoft.ContainerRegistry"
            "Microsoft.ContainerService"
            "Microsoft.KeyVault"
            "Microsoft.Cache"
            "Microsoft.DBforPostgreSQL"
            "Microsoft.ApiManagement"
            "Microsoft.OperationalInsights"
            "Microsoft.Network"
            "Microsoft.ManagedIdentity"
          )
          for provider in "${providers[@]}"; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --wait
          done
          echo "All providers registered."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Terraform Init
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform init -input=false -no-color

      - name: Terraform Plan
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="../../environments/${{ needs.detect-environment.outputs.stack }}.tfvars" \
            -out=tfplan

      - name: Terraform Show Plan
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform show -no-color tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.detect-environment.outputs.stack }}
          path: infra/stacks/${{ needs.detect-environment.outputs.stack }}/tfplan
          retention-days: 7

  terraform-apply:
    needs: detect-environment
    if: needs.detect-environment.outputs.is_shared_platform == 'false' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && !inputs.run_shared_platform_first))
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure Resource Providers
        shell: bash
        run: |
          echo "Registering required Azure resource providers..."
          providers=(
            "Microsoft.ContainerRegistry"
            "Microsoft.ContainerService"
            "Microsoft.KeyVault"
            "Microsoft.Cache"
            "Microsoft.DBforPostgreSQL"
            "Microsoft.ApiManagement"
            "Microsoft.OperationalInsights"
            "Microsoft.Network"
            "Microsoft.ManagedIdentity"
          )
          for provider in "${providers[@]}"; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --wait
          done
          echo "All providers registered."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Terraform Init
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform init -input=false -no-color

      - name: Terraform Plan
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="../../environments/${{ needs.detect-environment.outputs.stack }}.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -auto-approve \
            tfplan

      - name: Capture Outputs
        id: outputs
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          OUTPUTS=$(terraform output -json | base64 -w 0)
          echo "outputs=$OUTPUTS" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Secrets
        if: needs.detect-environment.outputs.stack == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLIENT_ID=$(terraform output -raw platform_identity_client_id 2>/dev/null || echo "")
          if [ -n "$CLIENT_ID" ] && [ "$CLIENT_ID" != "null" ]; then
            echo "$CLIENT_ID" | gh secret set MANAGED_IDENTITY_CLIENT_ID_DEV
            echo "Updated MANAGED_IDENTITY_CLIENT_ID_DEV secret"
          fi

  # Environment apply with shared-platform first
  terraform-apply-with-shared:
    needs: [detect-environment, shared-platform-apply]
    if: needs.detect-environment.outputs.is_shared_platform == 'false' && github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && inputs.run_shared_platform_first
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure Resource Providers
        shell: bash
        run: |
          echo "Registering required Azure resource providers..."
          providers=(
            "Microsoft.ContainerRegistry"
            "Microsoft.ContainerService"
            "Microsoft.KeyVault"
            "Microsoft.Cache"
            "Microsoft.DBforPostgreSQL"
            "Microsoft.ApiManagement"
            "Microsoft.OperationalInsights"
            "Microsoft.Network"
            "Microsoft.ManagedIdentity"
          )
          for provider in "${providers[@]}"; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --wait
          done
          echo "All providers registered."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Terraform Init
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform init -input=false -no-color

      - name: Terraform Plan
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="../../environments/${{ needs.detect-environment.outputs.stack }}.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -auto-approve \
            tfplan

      - name: Capture Outputs
        id: outputs
        working-directory: infra/stacks/${{ needs.detect-environment.outputs.stack }}
        shell: bash
        run: |
          OUTPUTS=$(terraform output -json | base64 -w 0)
          echo "outputs=$OUTPUTS" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Secrets
        if: needs.detect-environment.outputs.stack == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLIENT_ID=$(terraform output -raw platform_identity_client_id 2>/dev/null || echo "")
          if [ -n "$CLIENT_ID" ] && [ "$CLIENT_ID" != "null" ]; then
            echo "$CLIENT_ID" | gh secret set MANAGED_IDENTITY_CLIENT_ID_DEV
            echo "Updated MANAGED_IDENTITY_CLIENT_ID_DEV secret"
          fi

  notify:
    needs: [detect-environment, shared-platform-plan, shared-platform-apply, terraform-plan, terraform-apply, terraform-plan-with-shared, terraform-apply-with-shared]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Post status
        uses: actions/github-script@v7
        with:
          script: >
            var sp_plan = '${{ needs.shared-platform-plan.result }}';
            var sp_apply = '${{ needs.shared-platform-apply.result }}';
            var plan = '${{ needs.terraform-plan.result }}';
            var apply = '${{ needs.terraform-apply.result }}';
            var plan_shared = '${{ needs.terraform-plan-with-shared.result }}';
            var apply_shared = '${{ needs.terraform-apply-with-shared.result }}';
            const env = '${{ needs.detect-environment.outputs.environment }}';
            const is_sp = '${{ needs.detect-environment.outputs.is_shared_platform }}';
            if (!sp_plan) sp_plan = 'skipped';
            if (!sp_apply) sp_apply = 'skipped';
            if (!plan) plan = 'skipped';
            if (!apply) apply = 'skipped';
            if (!plan_shared) plan_shared = 'skipped';
            if (!apply_shared) apply_shared = 'skipped';
            var state = 'success';
            if (is_sp === 'true') {
              state = (sp_apply === 'success' || sp_apply === 'skipped') ? 'success' : 'failure';
            } else {
              state = (apply === 'success' || apply === 'skipped' || apply_shared === 'success') ? 'success' : 'failure';
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: 'alramz/terraform',
              description: 'tf ' + env + ' sp_plan=' + sp_plan + ' sp_apply=' + sp_apply + ' plan=' + plan + ' apply=' + apply,
            });
