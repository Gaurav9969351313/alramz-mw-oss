name: Sync Secrets to Azure Key Vault

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to sync secrets (dev, qa, preprod, prod)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - preprod
          - prod
        default: dev

permissions:
  contents: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      keyvault_name: ${{ steps.target.outputs.keyvault_name }}
      resource_group: ${{ steps.target.outputs.resource_group }}
      secret_names: ${{ steps.list-secrets.outputs.secret_names }}
    steps:

      - name: Determine target Key Vault
        id: target
        shell: bash
        run: |
          echo "========================================"
          echo "DEBUG: Selected environment"
          echo "========================================"
          ENV="${{ github.event.inputs.environment }}"
          echo "Environment: $ENV"
          case "$ENV" in
            dev)
              echo "keyvault_name=alramz-dev-key-vault" >> $GITHUB_OUTPUT
              echo "resource_group=alramz-dev-rg" >> $GITHUB_OUTPUT
              echo "location=uaenorth" >> $GITHUB_OUTPUT
              ;;
            qa)
              echo "keyvault_name=alramz-qa-key-vault" >> $GITHUB_OUTPUT
              echo "resource_group=alramz-qa-rg" >> $GITHUB_OUTPUT
              echo "location=uaenorth" >> $GITHUB_OUTPUT
              ;;
            preprod)
              echo "keyvault_name=alramz-preprod-key-vault" >> $GITHUB_OUTPUT
              echo "resource_group=alramz-preprod-rg" >> $GITHUB_OUTPUT
              echo "location=uaenorth" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "keyvault_name=alramz-prod-key-vault" >> $GITHUB_OUTPUT
              echo "resource_group=alramz-prod-rg" >> $GITHUB_OUTPUT
              echo "location=uaeneast" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unknown environment: $ENV"
              exit 1
              ;;
          esac
          echo "========================================"
          echo "DEBUG: Target Key Vault details"
          echo "========================================"
          echo "Key Vault: ${{ steps.target.outputs.keyvault_name }}"
          echo "Resource Group: ${{ steps.target.outputs.resource_group }}"
          echo "Location: ${{ steps.target.outputs.location }}"
          echo "========================================"

      - name: List repository secrets
        id: list-secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "========================================"
          echo "DEBUG: Listing repository secrets"
          echo "========================================"
          SECRETS="[]"
          PAGE=1
          REPO_API="https://api.github.com/repos/${{ github.repository }}/secrets"

          while true; do
            RESPONSE=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "${REPO_API}?per_page=100&page=$PAGE")

            COUNT=$(echo "$RESPONSE" | jq '.secrets | length')
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then break; fi

            BATCH=$(echo "$RESPONSE" | jq '.secrets | map(.name)')
            SECRETS=$(printf '%s\n%s\n' "$SECRETS" "$BATCH" | jq -s 'add | unique')

            TOTAL=$(echo "$RESPONSE" | jq '.total_count')
            if [ "$((PAGE * COUNT))" -ge "$TOTAL" ]; then break; fi
            PAGE=$((PAGE + 1))
          done

          SECRET_COUNT=$(echo "$SECRETS" | jq 'length')
          echo "Total secrets discovered: $SECRET_COUNT"
          echo "Secret names:"
          echo "$SECRETS" | jq -r '.[]'
          echo "========================================"
          echo "secret_names=$SECRETS" >> $GITHUB_OUTPUT

  sync-secrets:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        secret_name: ${{ fromJson(needs.prepare.outputs.secret_names) }}
    steps:

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync secret to Key Vault
        shell: bash
        env:
          KV_NAME: ${{ needs.prepare.outputs.keyvault_name }}
          SECRET_VALUE: ${{ secrets[matrix.secret_name] }}
        run: |
          echo "========================================"
          echo "DEBUG: Processing secret '${{ matrix.secret_name }}'"
          echo "Target Key Vault: $KV_NAME"
          echo "========================================"

          BLOCKLIST="^AZURE_CREDENTIALS$|^GITHUB_TOKEN$|^GH_PAT$"

          if echo "${{ matrix.secret_name }}" | grep -qE "$BLOCKLIST"; then
            echo "Skipping ${{ matrix.secret_name }} (system secret)"
            exit 0
          fi

          if [ -z "$SECRET_VALUE" ]; then
            echo "Skipping ${{ matrix.secret_name }} (empty value)"
            exit 0
          fi

          echo "Setting secret '${{ matrix.secret_name }}' in Key Vault '$KV_NAME'..."
          SET_RESULT=$(az keyvault secret set \
            --vault-name "$KV_NAME" \
            --name "${{ matrix.secret_name }}" \
            --value "$SECRET_VALUE" \
            --only-show-errors 2>&1)

          if [ $? -eq 0 ]; then
            echo "SUCCESS: '${{ matrix.secret_name }}' synced to Key Vault '$KV_NAME'"
            echo "$SET_RESULT"
          else
            echo "::error::FAILED: '${{ matrix.secret_name }}' could not be synced to Key Vault '$KV_NAME'"
            echo "Error details: $SET_RESULT"
            exit 1
          fi
          echo "========================================"