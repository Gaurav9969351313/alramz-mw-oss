name: Sync Secrets to Key Vault

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to sync secrets (dev, qa, preprod, prod)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - preprod
          - prod
        default: dev
      secrets_json:
        description: 'JSON object of secret name-value pairs to sync (e.g. {"DB_PASSWORD":"abc","API_KEY":"xyz"})'
        required: true
        type: string
        default: '{}'

permissions:
  contents: read
  id-token: write

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      keyvault_name: ${{ steps.target.outputs.keyvault_name }}
      resource_group: ${{ steps.target.outputs.resource_group }}
      secret_names: ${{ steps.parse-secrets.outputs.secret_names }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target Key Vault
        id: target
        shell: bash
        run: |
          ENV="${{ github.event.inputs.environment }}"
          case "$ENV" in
            dev)
              echo "keyvault_name=alramz-dev-key-vault" >> "$GITHUB_OUTPUT"
              echo "resource_group=alramz-dev-rg" >> "$GITHUB_OUTPUT"
              ;;
            qa)
              echo "keyvault_name=alramz-qa-key-vault" >> "$GITHUB_OUTPUT"
              echo "resource_group=alramz-qa-rg" >> "$GITHUB_OUTPUT"
              ;;
            preprod)
              echo "keyvault_name=alramz-preprod-key-vault" >> "$GITHUB_OUTPUT"
              echo "resource_group=alramz-preprod-rg" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "keyvault_name=alramz-prod-key-vault" >> "$GITHUB_OUTPUT"
              echo "resource_group=alramz-prod-rg" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown environment: $ENV"
              exit 1
              ;;
          esac

      - name: Parse secrets to sync
        id: parse-secrets
        shell: bash
        run: |
          SECRETS_JSON='${{ github.event.inputs.secrets_json }}'
          # Validate JSON
          echo "$SECRETS_JSON" | jq . > /dev/null 2>&1 || {
            echo "::error::Invalid JSON in secrets_json input"
            exit 1
          }
          # Extract secret names
          SECRET_NAMES=$(echo "$SECRETS_JSON" | jq -rc 'keys')
          if [ -z "$SECRET_NAMES" ] || [ "$SECRET_NAMES" = "null" ] || [ "$SECRET_NAMES" = "[]" ]; then
            echo "::error::No secrets provided in secrets_json"
            exit 1
          fi
          COUNT=$(echo "$SECRET_NAMES" | jq 'length')
          echo "secret_names=$SECRET_NAMES" >> "$GITHUB_OUTPUT"
          echo "Secrets to sync: $COUNT"
          echo "$SECRET_NAMES" | jq -r '.[]'

  sync-secrets:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        secret_name: ${{ fromJson(needs.prepare.outputs.secret_names) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync secret to Key Vault
        shell: bash
        env:
          KV_NAME: ${{ needs.prepare.outputs.keyvault_name }}
          SECRET_VALUE: ${{ fromJson(github.event.inputs.secrets_json)[matrix.secret_name] }}
        run: |
          set +e
          BLOCKLIST="^AZURE_CREDENTIALS$|^AZURE_CLIENT_ID$|^AZURE_TENANT_ID$|^AZURE_SUBSCRIPTION_ID$|^GH_TOKEN$|^GH_PAT$"
          if echo "${matrix.secret_name}" | grep -qE "$BLOCKLIST"; then
            echo "Skipping ${{ matrix.secret_name }} (system/identity secret)"
            exit 0
          fi
          if [ -z "$SECRET_VALUE" ] || [ "$SECRET_VALUE" = "null" ]; then
            echo "Skipping ${{ matrix.secret_name }} (empty value)"
            exit 0
          fi
          echo "Setting ${{ matrix.secret_name }} in Key Vault '$KV_NAME'..."
          echo "::add-mask::$SECRET_VALUE"
          CURRENT=$(az keyvault secret show --vault-name "$KV_NAME" --name "${matrix.secret_name}" --query id -o tsv 2>/dev/null) || true
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "null" ]; then
            az keyvault secret set-attributes --vault-name "$KV_NAME" --name "${matrix.secret_name}" --enabled false 2>/dev/null
          fi
          az keyvault secret set --vault-name "$KV_NAME" --name "${matrix.secret_name}" --value "$SECRET_VALUE"
          if [ $? -eq 0 ]; then
            echo "SUCCESS: ${{ matrix.secret_name }} synced to $KV_NAME"
          else
            echo "::error::FAILED: ${{ matrix.secret_name }} could not be synced to $KV_NAME"
            exit 1
          fi
