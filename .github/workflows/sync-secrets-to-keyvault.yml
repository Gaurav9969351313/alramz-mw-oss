name: Sync Secrets to Azure Key Vault

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to sync secrets (dev, qa, preprod, prod)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - preprod
          - prod
        default: dev

permissions:
  contents: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      keyvault_name: ${{ steps.target.outputs.keyvault_name }}
      resource_group: ${{ steps.target.outputs.resource_group }}
      secret_names: ${{ steps.parse-secrets.outputs.secret_names }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target Key Vault
        id: target
        shell: bash
        run: |
          echo "========================================"
          echo "DEBUG: Selected environment"
          echo "========================================"
          ENV="${{ github.event.inputs.environment }}"
          echo "Environment: $ENV"
          case "$ENV" in
            dev)
              KV_VAL="alramz-dev-key-vault"
              RG_VAL="alramz-dev-rg"
              LOC_VAL="uaenorth"
              ;;
            qa)
              KV_VAL="alramz-qa-key-vault"
              RG_VAL="alramz-qa-rg"
              LOC_VAL="uaenorth"
              ;;
            preprod)
              KV_VAL="alramz-preprod-key-vault"
              RG_VAL="alramz-preprod-rg"
              LOC_VAL="uaenorth"
              ;;
            prod)
              KV_VAL="alramz-prod-key-vault"
              RG_VAL="alramz-prod-rg"
              LOC_VAL="uaeneast"
              ;;
            *)
              echo "::error::Unknown environment: $ENV"
              exit 1
              ;;
          esac
          echo "keyvault_name=$KV_VAL" >> $GITHUB_OUTPUT
          echo "resource_group=$RG_VAL" >> $GITHUB_OUTPUT
          echo "location=$LOC_VAL" >> $GITHUB_OUTPUT
          echo "========================================"
          echo "DEBUG: Target Key Vault details"
          echo "========================================"
          echo "Key Vault: $KV_VAL"
          echo "Resource Group: $RG_VAL"
          echo "Location: $LOC_VAL"
          echo "========================================"

      - name: Parse secrets to sync
        id: parse-secrets
        shell: bash
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "========================================"
          echo "DEBUG: Reading secret sync map"
          echo "========================================"

          SECRET_NAMES=$(jq -rc --arg env "$ENV" '.[$env].secrets' .github/secret-sync-map.json)

          if [ -z "$SECRET_NAMES" ] || [ "$SECRET_NAMES" = "null" ]; then
            echo "::error::No secrets defined for environment '$ENV' in .github/secret-sync-map.json"
            exit 1
          fi

          COUNT=$(echo "$SECRET_NAMES" | jq 'length')
          echo "Environment: $ENV"
          echo "Secrets to sync: $COUNT"
          echo "$SECRET_NAMES" | jq -r '.[]'
          echo "========================================"

          echo "secret_names=$SECRET_NAMES" >> $GITHUB_OUTPUT

  sync-secrets:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        secret_name: ${{ fromJson(needs.prepare.outputs.secret_names) }}
    steps:

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync secret to Key Vault
        shell: bash
        env:
          KV_NAME: ${{ needs.prepare.outputs.keyvault_name }}
          SECRET_VALUE: ${{ secrets[matrix.secret_name] }}
        run: |
          set +e
          echo "========================================"
          echo "DEBUG: Processing secret '${{ matrix.secret_name }}'"
          echo "Target Key Vault: $KV_NAME"
          echo "========================================"

          BLOCKLIST="^AZURE_CREDENTIALS$|^GITHUB_TOKEN$|^GH_PAT$"

          if echo "${{ matrix.secret_name }}" | grep -qE "$BLOCKLIST"; then
            echo "Skipping ${{ matrix.secret_name }} (system secret)"
            exit 0
          fi

          if [ -z "$SECRET_VALUE" ]; then
            echo "Skipping ${{ matrix.secret_name }} (empty value)"
            exit 0
          fi

          echo "Setting secret '${{ matrix.secret_name }}' in Key Vault '$KV_NAME'..."

          CURRENT_VERSION=$(az keyvault secret show \
            --vault-name "$KV_NAME" \
            --name "${{ matrix.secret_name }}" \
            --query "id" \
            --only-show-errors 2>/dev/null) || true

          if [ -n "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "null" ]; then
            echo "Disabling current version of '${{ matrix.secret_name }}'..."
            az keyvault secret set-attributes \
              --vault-name "$KV_NAME" \
              --name "${{ matrix.secret_name }}" \
              --enabled false \
              --only-show-errors 2>/dev/null
          fi

          SET_RESULT=$(az keyvault secret set \
            --vault-name "$KV_NAME" \
            --name "${{ matrix.secret_name }}" \
            --value "$SECRET_VALUE" \
            --only-show-errors 2>&1)
          SET_EXIT=$?

          if [ $SET_EXIT -eq 0 ]; then
            echo "SUCCESS: '${{ matrix.secret_name }}' synced to Key Vault '$KV_NAME'"
            echo "$SET_RESULT"
          else
            echo "::error::FAILED: '${{ matrix.secret_name }}' could not be synced to Key Vault '$KV_NAME'"
            echo "Error details: $SET_RESULT"
            exit 1
          fi
          echo "========================================"
