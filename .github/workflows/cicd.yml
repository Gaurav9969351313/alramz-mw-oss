name: CICD

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - feature/code-pramotion-v2

permissions:
  contents: read
  pull-requests: write

jobs:

  # STEP 1 - Detect changed services
  detect-changes:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      services: ${{ steps.matrix.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            services:
              - 'services/**'

          list-files: json

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          FILES='${{ steps.filter.outputs.services_files }}'

          SERVICES=$(echo "$FILES" \
            | jq -r '.[]' \
            | cut -d/ -f2 \
            | sort -u \
            | jq -R . \
            | jq -s -c .)

          if [ -z "$SERVICES" ] || [ "$SERVICES" = "null" ]; then
            SERVICES="[]"
          fi

          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Detected services: $SERVICES"


      - name: Check if services detected
        shell: bash
        run: |
          if [ '${{ steps.matrix.outputs.services }}' = '[]' ] || [ -z '${{ steps.matrix.outputs.services }}' ]; then
            echo "No services detected, skipping remaining jobs"
            exit 0
          fi

  # STEP 2 - Test the code 
  test:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        uses: ./.github/actions/maven-test
        with:
          service-name: ${{ matrix.service }}

  # STEP 3 - Build each changed service
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    needs: 
      - detect-changes
      - test

    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        shell: bash
        run: |
          az acr login --name alramzregistry

      - name: Generate Image Tag
        id: tag
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::5}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: ./.github/actions/build-service
        with:
          service-name: ${{ matrix.service }}
          acr-name: alramzregistry.azurecr.io

  # STEP 4 - Deploy changed services to Development
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    needs: build
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Generate Image Tag
        id: tag
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::5}" >> $GITHUB_OUTPUT

      - name: Build services JSON
        id: services-json
        shell: bash
        run: |
          SERVICE="${{ matrix.service }}"
          TAG="${{ steps.tag.outputs.tag }}"

          JSON=$(echo "[]" | jq -c --arg service "$SERVICE" --arg tag "$TAG" '[.[] | {service: $service, tag: $tag}]')

          printf 'json=%s\n' "$JSON" >> "$GITHUB_OUTPUT"

      - name: Deploy Service
        uses: ./.github/actions/deploy-aca
        with:
          services: ${{ steps.services-json.outputs.json }}
          acr-name: alramzregistry.azurecr.io
          resource-group: alramz-dev-rg
          location: uaenorth
          aca-environment-id: alramz-dev-container-apps-env
          managed-identity: ${{ secrets.MANAGED_IDENTITY_DEV }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

  # STEP 5 - Update Development deployment catalogue
  update-catalogue:
    runs-on: ubuntu-latest
    environment: dev
    needs: deploy
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Generate Image Tag
        id: tag
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::5}" >> $GITHUB_OUTPUT

      - name: Update dev.yml
        shell: bash
        run: |
          SERVICE="${{ matrix.service }}"
          TAG="${{ steps.tag.outputs.tag }}"

          yq -i ".services[\"${SERVICE}\"].tag = \"${TAG}\"" .github/service-deployment-catalogue/dev.yml

      - name: Commit catalogue update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/service-deployment-catalogue/dev.yml
          git diff --staged --quiet || git commit -m "Update dev catalogue for ${{ matrix.service }}"
          git push
