name: CICD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or 0.0.1). Leave empty to publish current snapshot versions.'
        required: false
        type: string
        default: ''
  push:
    branches:
      - dev
      - feature/code

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:

  # STEP 1 - Detect changed services
  detect-services:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      is_release: ${{ steps.type.outputs.is_release }}
      version: ${{ steps.type.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine publish type
        id: type
        shell: bash
        run: |
          echo "========================================"
          echo "DEBUG: Determining publish type"
          echo "========================================"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "Release mode: ${{ github.event.inputs.version }}"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "Snapshot mode"
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          fi
          echo "========================================"

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          echo "========================================"
          echo "DEBUG: Detecting changed services"
          echo "========================================"

          set +e
          if [ "${{ steps.type.outputs.is_release }}" == "true" ]; then
            echo "Release mode: including all services"
            SERVICES=$(find services -maxdepth 2 -name pom.xml -exec dirname {} \; | sed 's|services/||' | sort -u | jq -R . | jq -s -c .)
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Snapshot mode: detecting changed services"

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
            else
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
            fi

            echo "Comparing:"
            echo "BASE: $BASE"
            echo "HEAD: $HEAD"

            CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)
            SERVICES="[]"

            if [ -n "$CHANGED" ]; then
              SERVICES=$(echo "$CHANGED" \
                | grep '^services/' \
                | cut -d/ -f2 \
                | sort -u \
                | jq -R . \
                | jq -s -c .)
              if [ -z "$SERVICES" ] || [ "$SERVICES" = "null" ]; then
                SERVICES="[]"
              fi
            fi

            if [[ "$SERVICES" == "[]" ]] || [[ -z "$SERVICES" ]]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          fi
          set -e

          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Changed services: $SERVICES"
          echo "========================================"

      - name: Check if services detected
        id: check
        shell: bash
        run: |
          if [ '${{ steps.matrix.outputs.services }}' = '[]' ] || [ -z '${{ steps.matrix.outputs.services }}' ]; then
            echo "No services detected, skipping remaining jobs"
            echo "has_services=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "has_services=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if services detected
        shell: bash
        run: |
          if [ '${{ steps.matrix.outputs.services }}' = '[]' ] || [ -z '${{ steps.matrix.outputs.services }}' ]; then
            echo "No services detected, skipping remaining jobs"
            exit 0
          fi

  # STEP 2 - Test the code 
  test:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: detect-services
    if: needs.detect-services.outputs.has_changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services == '' && '["placeholder"]' || needs.detect-services.outputs.services == '[]' && '["placeholder"]' || needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        uses: ./.github/actions/maven-test
        with:
          service-name: ${{ matrix.service }}
          github-token: ${{ secrets.GH_TOKEN }}

  # STEP 3 - Build each changed service
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    needs: 
      - detect-services
      - test
      - publish-maven

    if: needs.detect-services.outputs.has_changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services == '' && '["placeholder"]' || needs.detect-services.outputs.services == '[]' && '["placeholder"]' || needs.detect-services.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        shell: bash
        run: |
          az acr login --name alramzregistry

      - name: Generate Image Tag
        id: tag
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::5}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: ./.github/actions/build-service
        with:
          service-name: ${{ matrix.service }}
          acr-name: alramzregistry.azurecr.io
          github-token: ${{ secrets.GH_TOKEN }}

  # STEP 4 - Deploy changed services to Development
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - build
      - detect-services
    if: needs.detect-services.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Generate Image Tag
        id: tag
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::5}" >> $GITHUB_OUTPUT

      - name: Build services JSON
        id: services-json
        shell: bash
        run: |
          SERVICE="${{ matrix.service }}"
          TAG="${{ steps.tag.outputs.tag }}"

          JSON=$(jq -n -c --arg service "$SERVICE" --arg tag "$TAG" '[{service: $service, tag: $tag}]')

          printf 'json=%s\n' "$JSON" >> "$GITHUB_OUTPUT"

      - name: Deploy Service
        uses: ./.github/actions/deploy-aca
        with:
          services: ${{ steps.services-json.outputs.json }}
          acr-name: alramzregistry.azurecr.io
          resource-group: alramz-dev-rg
          location: uaenorth
          aca-environment-id: alramz-dev-container-apps-env
          managed-identity: ${{ secrets.MANAGED_IDENTITY_DEV }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

  # STEP 5 - Update Development deployment catalogue
  update-catalogue:
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - deploy
      - detect-services
    if: needs.detect-services.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Generate Image Tag
        id: tag
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::5}" >> $GITHUB_OUTPUT

      - name: Update service-register.yml
        shell: bash
        run: |
          SERVICE="${{ matrix.service }}"
          TAG="${{ steps.tag.outputs.tag }}"

          yq -i ".services[\"${SERVICE}\"].tag = \"${TAG}\"" .github/service-deployment-catalogue/service-register.yml

      - name: Commit catalogue update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout qa
          git pull origin qa
          git checkout -b update-${{ matrix.service }}-${{ github.run_number }}
          # Update service-register.yml

          git add .github/service-deployment-catalogue/service-register.yml

          git commit -m "Update deployment catalogue for ${{ matrix.service }}"

          git push origin HEAD

          gh pr create \
            --base qa \
            --head update-${{ matrix.service }}-${{ github.run_number }} \
            --title "Update deployment catalogue for ${{ matrix.service }}" \
            --body "Updates deployment catalogue for ${{ matrix.service }}"

          
          # git add .github/service-deployment-catalogue/service-register.yml
          # git diff --staged --quiet || git commit -m "Update dev catalogue for ${{ matrix.service }}"
          # git push origin dev
          # gh pr create --title "Update dev catalogue for ${{ matrix.service }}" --body "Updates deployment catalogue for ${{ matrix.service }}" --base qa --head dev --repo "${{ github.repository }}" || true

  # STEP 6 - Publish Maven artifacts to GitHub Packages
  publish-maven:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs:
      - detect-services
    if: needs.detect-services.outputs.has_changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services == '' && '["placeholder"]' || needs.detect-services.outputs.services == '[]' && '["placeholder"]' || needs.detect-services.outputs.services) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish to GitHub Packages
        uses: ./.github/actions/maven-publish
        with:
          service-path: services/${{ matrix.service }}
          version: ${{ needs.detect-services.outputs.is_release == 'true' && needs.detect-services.outputs.version || '' }}
          java-version: '21'
          skip-tests: true
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Tag release and bump to next snapshot
        if: ${{ matrix.service == 'alramz-common-bom' && needs.detect-services.outputs.is_release == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "========================================"
          echo "DEBUG: Tagging release and bumping version"
          echo "========================================"
          cd services/alramz-common-bom
          TAG="alramz-common-bom-${{ needs.detect-services.outputs.version }}"
          MAJOR=$(echo ${{ needs.detect-services.outputs.version }} | cut -d. -f1)
          MINOR=$(echo ${{ needs.detect-services.outputs.version }} | cut -d. -f2)
          PATCH=$(echo ${{ needs.detect-services.outputs.version }} | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_SNAPSHOT="$MAJOR.$MINOR.$NEXT_PATCH-SNAPSHOT"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pom.xml
          git commit -m "chore(bom): release ${{ needs.detect-services.outputs.version }}"
          git tag -a "$TAG" -m "Release ${{ needs.detect-services.outputs.version }}"
          git push origin HEAD:dev
          git push origin "$TAG"

          mvn versions:set -DnewVersion=$NEXT_SNAPSHOT -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore(bom): bump version to $NEXT_SNAPSHOT"
          git push origin HEAD:dev
          echo "========================================"
          echo "SUCCESS: Tagged $TAG and bumped to $NEXT_SNAPSHOT"
          echo "========================================"
