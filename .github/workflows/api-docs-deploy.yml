name: Deploy API Docs

on:
  push:
    branches:
      - main
      - feature/*
    paths:
      - 'services/**/specs/**.yaml'
      - 'services/**/specs/**.yml'
      - '.github/workflows/api-docs-deploy.yml'
      - 'scripts/generate-api-docs.sh'
      - 'scripts/create-auth-wrapper.js'
      - 'docs/templates/**'
      - 'docs/api-docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DOCS_DIR: api-docs-build

jobs:
  detect-specs:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.detect.outputs.specs }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect OpenAPI specs
        id: detect
        shell: bash
        run: |
          SPECS="[]"

          # Find all OpenAPI spec files
          while IFS= read -r spec_file; do
            if [ -z "$spec_file" ]; then continue; fi

            SERVICE=$(echo "$spec_file" | cut -d'/' -f2)
            SERVICE_NAME=$(echo "$SERVICE" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')

            SPEC_DATA=$(jq -n \
              --arg service "$SERVICE" \
              --arg service_name "$SERVICE_NAME" \
              --arg spec_file "$spec_file" \
              '{service: $service, service_name: $service_name, spec_file: $spec_file}')

            SPECS=$(echo "$SPECS" | jq ". += [$SPEC_DATA]")
          done < <(find services -path "*/specs/*.yaml" -o -path "*/specs/*.yml" | sort)

          # Output specs as JSON (handle multiline)
          echo "specs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SPECS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$SPECS" != "[]" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Found API specs"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No API specs found"
          fi

  build:
    needs: detect-specs
    if: needs.detect-specs.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create docs build directory
        shell: bash
        run: mkdir -p ${{ env.DOCS_DIR }}/specs

      - name: Copy OpenAPI specs
        shell: bash
        run: |
          SPECS='${{ needs.detect-specs.outputs.specs }}'
          echo "$SPECS" | jq -r '.[] | .spec_file' | while read -r spec; do
            mkdir -p "${{ env.DOCS_DIR }}/specs/$(dirname "$spec" | sed 's|services/||')"
            cp "$spec" "${{ env.DOCS_DIR }}/specs/$(echo "$spec" | sed 's|services/||')"
          done

          echo "Copied specs:"
          find "${{ env.DOCS_DIR }}/specs" -type f

      - name: Generate API docs manifest
        shell: bash
        env:
          SPECS: ${{ needs.detect-specs.outputs.specs }}
        run: |
          cat > ${{ env.DOCS_DIR }}/specs/manifest.json << 'EOF'
          ${{ needs.detect-specs.outputs.specs }}
          EOF
          cat ${{ env.DOCS_DIR }}/specs/manifest.json

      - name: Copy HTML Template
        shell: bash
        run: |
          cp docs/templates/docs.html ${{ env.DOCS_DIR }}/docs.html
          echo "✓ HTML template copied"

      - name: Copy Viewer Files
        shell: bash
        run: |
          if [ -f "api-docs-build/viewer-notification.html" ]; then
            cp api-docs-build/viewer-notification.html ${{ env.DOCS_DIR }}/viewer-notification.html
          fi

          if [ -f "api-docs-build/viewer-validation.html" ]; then
            cp api-docs-build/viewer-validation.html ${{ env.DOCS_DIR }}/viewer-validation.html
          fi

          echo "Viewer files status:"
          ls -la ${{ env.DOCS_DIR }}/viewer-*.html 2>/dev/null || echo "No viewer files found"

      - name: Replace API manifest
        shell: bash
        run: |
          python3 << 'EOF'
          import json

          specs = """${{ needs.detect-specs.outputs.specs }}"""
          try:
              specs_json = json.loads(specs)
              specs_str = json.dumps(specs_json)
          except:
              specs_str = '[]'

          with open('${{ env.DOCS_DIR }}/docs.html', 'r') as f:
              content = f.read()

          content = content.replace('%%API_MANIFEST%%', specs_str)

          with open('${{ env.DOCS_DIR }}/docs.html', 'w') as f:
              f.write(content)

          print("✓ Injected API specs")
          EOF

      - name: Create Auth Wrapper and Setup Index
        shell: bash
        env:
          DOCS_USERNAME: ${{ secrets.DOCS_USERNAME }}
          DOCS_PASSWORD: ${{ secrets.DOCS_PASSWORD }}
        run: |
          # If secrets are configured, create auth wrapper
          if [ ! -z "$DOCS_USERNAME" ] && [ ! -z "$DOCS_PASSWORD" ]; then
            echo "Creating auth wrapper..."
            node scripts/create-auth-wrapper.js ${{ env.DOCS_DIR }}

            # Rename auth wrapper to be the index
            if [ -f "${{ env.DOCS_DIR }}/auth-index.html" ]; then
              mv ${{ env.DOCS_DIR }}/auth-index.html ${{ env.DOCS_DIR }}/index.html
              echo "✓ Auth wrapper enabled"
              echo "✓ Login required: $DOCS_USERNAME"
            fi
          else
            # No auth - make docs.html the index page
            if [ ! -f "${{ env.DOCS_DIR }}/index.html" ] && [ -f "${{ env.DOCS_DIR }}/docs.html" ]; then
              cp ${{ env.DOCS_DIR }}/docs.html ${{ env.DOCS_DIR }}/index.html
              echo "✓ Setup docs.html as index (no auth)"
            fi
          fi

      - name: Validate Documentation
        shell: bash
        run: |
          echo "📋 Validation Report:"
          echo ""

          # Check index.html exists
          if [ -f "${{ env.DOCS_DIR }}/index.html" ]; then
            echo "✓ index.html exists"
          else
            echo "✗ index.html missing"
            exit 1
          fi

          # Check docs.html exists
          if [ -f "${{ env.DOCS_DIR }}/docs.html" ]; then
            echo "✓ docs.html exists"
          else
            echo "✗ docs.html missing"
            exit 1
          fi

          # Check specs exist
          SPEC_COUNT=$(find "${{ env.DOCS_DIR }}/specs" -name "*.yaml" -o -name "*.yml" | wc -l)
          if [ "$SPEC_COUNT" -gt 0 ]; then
            echo "✓ Found $SPEC_COUNT OpenAPI specs"
          else
            echo "✗ No OpenAPI specs found"
            exit 1
          fi

          # Check manifest
          if [ -f "${{ env.DOCS_DIR }}/specs/manifest.json" ]; then
            echo "✓ manifest.json exists"
          else
            echo "✗ manifest.json missing"
            exit 1
          fi

          # List all files
          echo ""
          echo "📁 Generated files:"
          find "${{ env.DOCS_DIR }}" -type f | sed 's/^/  /'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DOCS_DIR }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## 📚 API Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docs available at: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -z "${{ secrets.DOCS_USERNAME }}" ] && [ ! -z "${{ secrets.DOCS_PASSWORD }}" ]; then
            echo "### 🔐 Login Gate Enabled" >> $GITHUB_STEP_SUMMARY
            echo "Username: \`${{ secrets.DOCS_USERNAME }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Login Gate Not Configured" >> $GITHUB_STEP_SUMMARY
            echo "To add a login gate, set GitHub Secrets:" >> $GITHUB_STEP_SUMMARY
            echo "- \`DOCS_USERNAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`DOCS_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 🔐 API Authentication Methods:" >> $GITHUB_STEP_SUMMARY
          echo "- **Basic Auth**: Username and Password" >> $GITHUB_STEP_SUMMARY
          echo "- **JWT Token**: Bearer token authentication" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🌍 Available APIs:" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.detect-specs.outputs.specs }}' | jq -r '.[] | "- " + .service_name' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📖 Documentation" >> $GITHUB_STEP_SUMMARY
          echo "- [Quick Start](../../docs/QUICK-START.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Local Setup](../../docs/LOCAL-SETUP.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Full Guide](../../docs/API-DOCS.md)" >> $GITHUB_STEP_SUMMARY
