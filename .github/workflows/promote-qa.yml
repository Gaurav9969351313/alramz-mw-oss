name: Deploy QA Promotion

on:
  workflow_dispatch:
  pull_request:
    branches:
      - qa
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy-to-qa:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        shell: bash
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Get changed services
        id: changes
        shell: bash
        run: |
          SERVERS_FILE=".github/service-deployment-catalogue/service-register.yml"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          PARENT_SHA=$(git rev-parse "${MERGE_SHA}^1" 2>/dev/null || echo "")

          if [ ! -f "$SERVERS_FILE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -n "$PARENT_SHA" ]; then
            CHANGED=$(git diff "$PARENT_SHA" "$MERGE_SHA" -- "$SERVERS_FILE" 2>/dev/null || true)
          else
            CHANGED=""
          fi

          if [ -n "$CHANGED" ]; then
            SERVICES=$(echo "$CHANGED" | grep '^+' | grep -E '^\+  [a-zA-Z0-9_-]+:' | sed 's/^+  \([^:]*\):.*/\1/' | sort -u)
          else
            SERVICES=$(yq '.services | keys' "$SERVERS_FILE" 2>/dev/null | grep -v null | grep -v 'null' || true)
          fi

          if [ -z "$SERVICES" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SERVICES_CSV=$(echo "$SERVICES" | tr '\n' ',' | sed 's/,$//')
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "services=$SERVICES_CSV" >> $GITHUB_OUTPUT

      - name: Build services JSON
        id: services-json
        shell: bash
        run: |
          SERVICES_CSV="${{ steps.changes.outputs.services }}"
          SERVERS_FILE=".github/service-deployment-catalogue/qa.yml"

          JSON_ARRAY="[]"
          IFS=',' read -ra SVC_ARRAY <<< "$SERVICES_CSV"
          for SVC in "${SVC_ARRAY[@]}"; do
            TAG=$(yq ".services[\"$SVC\"].tag" "$SERVERS_FILE")
            JSON_ARRAY=$(echo "$JSON_ARRAY" | jq -c --arg service "$SVC" --arg tag "$TAG" '. + [{service: $service, tag: $tag}]')
          done
          echo "json=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

      - name: Deploy Services
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/deploy-aca
        with:
          services: ${{ steps.services-json.outputs.json }}
          acr-name: alramzregistry.azurecr.io
          resource-group: alramz-qa-rg
          location: uaenorth
          aca-environment-id: ${{ secrets.ACA_ENVIRONMENT_ID_QA }}
          managed-identity: ${{ secrets.MANAGED_IDENTITY_QA }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
