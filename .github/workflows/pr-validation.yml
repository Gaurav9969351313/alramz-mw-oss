name: PR Validation

on:
  push:
    paths-ignore:
      - 'infra/**'
      - feature/*
  pull_request:
    branches: [dev, qa, preprod, prod]
    paths-ignore:
      - 'infra/**'

permissions:
  contents: read
  pull-requests: write
  packages: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:

  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      deploy_services: ${{ steps.detect.outputs.deploy_services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      has_deploy_changes: ${{ steps.detect.outputs.has_deploy_changes }}
      liquibase_services: ${{ steps.filter.outputs.liquibase_services }}
      terraform_changed: ${{ steps.filter.outputs.terraform_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        uses: ./.github/actions/detect-services
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Filter liquibase + terraform changes
        id: filter
        shell: bash
        run: |
          SERVICES="${{ steps.detect.outputs.deploy_services }}"
          LIQUI="[]"
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            [ -n "$svc" ] || continue
            if [ -d "services/$svc/src/main/resources/db/changelog" ]; then
              LIQUI=$(echo "$LIQUI" | jq -c --arg s "$svc" '. + [$s]')
            fi
          done
          echo "liquibase_services=$LIQUI" >> "$GITHUB_OUTPUT"

          CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if echo "$CHANGED_FILES" | grep -q '^infra/'; then
            echo "terraform_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform_changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services == '[]' && '["__none__"]' || needs.detect.outputs.services) }}
    steps:
      - name: Run tests
        if: ${{ matrix.service != '__none__' }}
        uses: ./.github/actions/maven-test
        with:
          service-name: ${{ matrix.service }}
          github-token: ${{ secrets.GH_TOKEN }}

  liquibase-validate:
    needs: detect
    if: needs.detect.outputs.liquibase_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.liquibase_services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install yq
        shell: bash
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure Maven settings
        shell: bash
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>x-access-token</username>
                <password>${{ secrets.GH_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Install BOM locally
        shell: bash
        run: |
          cd services/alramz-common-bom
          mvn -B -ntp install -DskipTests -N
      - name: Validate Liquibase migrations
        shell: bash
        run: |
          cd services/${{ matrix.service }}
          mvn -B -ntp -s $HOME/.m2/settings.xml liquibase:validate

  maven-sca:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          github-token: ${{ secrets.GH_TOKEN }}

  terraform-lint:
    needs: detect
    if: needs.detect.outputs.terraform_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform validation
        uses: ./.github/actions/terraform-validate
        with:
          working-directory: infra/stacks/shared-platform

  pr-comment:
    needs: [detect, test, liquibase-validate, maven-sca, terraform-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Post validation summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## CI Validation Summary',
              '',
              '| Job | Status |',
              '| --- | --- |',
              '| detect-changes | ${{ (needs.detect.result || 'completed') }} |',
              '| test | ${{ (needs.test.result || 'skipped') }} |',
              '| liquibase-validate | ${{ (needs.liquibase-validate.result || 'skipped') }} |',
              '| maven-sca | ${{ (needs.maven-sca.result || 'skipped') }} |',
              '| terraform-lint | ${{ (needs.terraform-lint.result || 'skipped') }} |',
              '',
              '- Services changed: `${{ toJson(needs.detect.outputs.services) }}`',
              '- Deployable services changed: `${{ toJson(needs.detect.outputs.deploy_services) }}`',
              '- Liquibase services: `${{ toJson(needs.detect.outputs.liquibase_services) }}`',
              '',
              'Libraries (e.g. alramz-common-bom, alramz-api-starter) are tested but never deployed to ACA.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
