name: Deploy to ACA

description: >
  Deploys services to Azure Container Apps by digest. Renders the shared
  containerapp template (with Key Vault secret references via Managed Identity)
  and creates or updates the container app. Uses OIDC for Azure auth.

inputs:
  services:
    description: 'JSON array of objects: {service, tag, digest}'
    required: true
  acr-name:
    description: ACR Login Server (e.g. alramzregistry.azurecr.io) for registry auth
    required: true
  registry-base:
    description: 'Full registry base path for image references (e.g. ghcr.io/owner, alramzregistry.azurecr.io). Defaults to acr-name.'
    required: false
    type: string
    default: ''
  resource-group:
    description: Azure Resource Group
    required: true
  location:
    description: Azure Location
    required: true
  aca-environment-id:
    description: Container App Environment name or resource ID
    required: true
  managed-identity:
    description: User Assigned Managed Identity (resource ID, name, or client id)
    required: true
  keyvault:
    description: Key Vault name for DB password secret reference
    required: true
  environment:
    description: Target environment name (dev, qa, preprod, prod) for logging
    required: false
    type: string
    default: dev
  spring-profile-override:
    description: Override the springProfile from service.yaml
    required: false
    type: string
    default: ''
  azure-client-id:
    description: Azure OIDC client id
    required: true
    type: string
  azure-tenant-id:
    description: Azure OIDC tenant id
    required: true
    type: string
  azure-subscription-id:
    description: Azure subscription id
    required: true
    type: string

outputs:
  deployed-services:
    description: JSON array of {service, image, url}
    value: ${{ steps.deploy.outputs.deployed-services }}
  deployment-urls:
    description: JSON map of service -> public URL
    value: ${{ steps.deploy.outputs.deployment-urls }}

runs:
  using: composite

  steps:
    - name: Install yq
      shell: bash
      run: |
        wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
        chmod +x /usr/local/bin/yq

    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure OIDC login
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Deploy services
      id: deploy
      shell: bash
      env:
        SERVICES: ${{ inputs.services }}
        ACR: ${{ inputs.acr-name }}
        REGISTRY_BASE: ${{ inputs.registry-base }}
        RG: ${{ inputs.resource-group }}
        LOCATION: ${{ inputs.location }}
        ACA_ENV: ${{ inputs.aca-environment-id }}
        MANAGED_IDENTITY: ${{ inputs.managed-identity }}
        KEYVAULT: ${{ inputs.keyvault }}
        ENV_NAME: ${{ inputs.environment }}
        SPRING_PROFILE_OVERRIDE: ${{ inputs.spring-profile-override }}
      run: |
        set -euo pipefail

        RG="$RG"
        ACR="$ACR"
        REGISTRY_BASE="${REGISTRY_BASE:-$ACR}"
        LOCATION="$LOCATION"
        KEYVAULT="$KEYVAULT"
        ENV_NAME="$ENV_NAME"

        # Resolve ACA environment name -> resource id
        if [[ "$ACA_ENV" == /* ]]; then
          ENV_ID="$ACA_ENV"
        else
          ENV_ID=$(az containerapp env show -g "$RG" -n "$ACA_ENV" --query id -o tsv 2>/dev/null || echo "$ACA_ENV")
        fi

        # Resolve managed identity (client id / name) -> resource id
        if [[ "$MANAGED_IDENTITY" == /* ]]; then
          MI_ID="$MANAGED_IDENTITY"
        else
          MI_ID=$(az identity list -g "$RG" --query "[?clientId=='$MANAGED_IDENTITY'].id|[0]" -o tsv 2>/dev/null || true)
          if [ -z "$MI_ID" ] || [ "$MI_ID" = "null" ]; then
            MI_ID=$(az identity show -g "$RG" -n "$MANAGED_IDENTITY" --query id -o tsv 2>/dev/null || echo "$MANAGED_IDENTITY")
          fi
        fi

        export LOCATION ACA_ENV_ID="$ENV_ID" MANAGED_IDENTITY="$MI_ID" ACR_SERVER="$ACR" KEYVAULT_NAME="$KEYVAULT"

        COUNT=$(echo "$SERVICES" | jq 'length')
        DEPLOYED="[]"
        URLS='{}'

        for i in $(seq 0 $((COUNT - 1))); do
          SVC=$(echo "$SERVICES" | jq -r ".[$i].service")
          TAG=$(echo "$SERVICES" | jq -r ".[$i].tag")
          DIGEST=$(echo "$SERVICES" | jq -r ".[$i].digest")
          IMAGE="$REGISTRY_BASE/$SVC:$TAG@$DIGEST"

          echo "=== Deploying $SVC (tag: $TAG, digest: $DIGEST) ==="

          SCRIPT_DIR=".github/deployment/scripts"
          bash "${SCRIPT_DIR}/render-template.sh" "$SVC" "$IMAGE"

          EXISTS=$(az containerapp show --name "$SVC" --resource-group "$RG" --query "name" -o tsv 2>/dev/null || true)

          if [ -n "$EXISTS" ] && [ "$EXISTS" != "null" ]; then
            echo "Container app exists, updating image..."
            az containerapp update \
              --name "$SVC" \
              --resource-group "$RG" \
              --image "$IMAGE"
          else
            echo "Container app does not exist, creating..."
            az deployment group create \
              --resource-group "$RG" \
              --name "init-$SVC-${TAG:0:10}" \
              --template-file containerapp.yaml \
              --no-prompt 2>/dev/null || {
                echo "ARM template create failed, falling back to flag-based create"
                CONFIG="services/$SVC/service.yaml"
                CPU=$(yq '.container.cpu' "$CONFIG")
                MEM=$(yq '.container.memory' "$CONFIG")
                PORT=$(yq '.container.targetPort' "$CONFIG")
                EXTERNAL=$(yq '.ingress.external' "$CONFIG")
                MIN=$(yq '.scale.minReplicas' "$CONFIG")
                MAX=$(yq '.scale.maxReplicas' "$CONFIG")
                SP=$(yq '.environment.springProfile' "$CONFIG")
                [ -n "$SPRING_PROFILE_OVERRIDE" ] && SP="$SPRING_PROFILE_OVERRIDE"
                JAVA=$(yq '.environment.javaOpts' "$CONFIG")
                INGRESS="internal"
                if [ "$EXTERNAL" = "true" ] || [ "$EXTERNAL" = "True" ]; then INGRESS="external"; fi
                az containerapp create \
                  --name "$SVC" \
                  --resource-group "$RG" \
                  --environment "$ENV_ID" \
                  --image "$IMAGE" \
                  --cpu "$CPU" \
                  --memory "$MEM" \
                  --target-port "$PORT" \
                  --ingress "$INGRESS" \
                  --min-replicas "$MIN" \
                  --max-replicas "$MAX" \
                  --registry-server "$ACR" \
                  --env "SPRING_PROFILES_ACTIVE=$SP" "JAVA_OPTS=$JAVA"
            }
          fi

          URL=$(az containerapp show --name "$SVC" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)

          DEPLOYED=$(echo "$DEPLOYED" | jq -c --arg svc "$SVC" --arg img "$IMAGE" --arg url "$URL" '. + [{service:$svc, image:$img, url:$url}]')
          URLS=$(echo "$URLS" | jq -c --arg svc "$SVC" --arg url "$URL" '.[$svc]=$url')
          echo "=== Deployed $SVC ($URL) ==="
        done

        echo "deployed-services=$DEPLOYED" >> "$GITHUB_OUTPUT"
        echo "deployment-urls=$URLS" >> "$GITHUB_OUTPUT"
