name: Build Service

inputs:
  service-name:
    description: Service Name
    required: true

  acr-name:
    description: ACR Login Server
    required: true
  
  image-tag:
    required: true

permissions:
  contents: read

runs:
  using: composite

  steps:
    - name: Generate Image Tag
      shell: bash
      run: |
        echo "IMAGE_TAG=$(git rev-parse --short=5 HEAD)" >> $GITHUB_ENV

    - name: Check for Dockerfile
      id: dockerfile-check
      shell: bash
      run: |
        if [ -f "services/${{ inputs.service-name }}/Dockerfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Skip build (no Dockerfile)
      if: ${{ steps.dockerfile-check.outputs.exists != 'true' }}
      shell: bash
      run: |
        echo "========================================"
        echo "SKIP: No Dockerfile found for ${{ inputs.service-name }}"
        echo "========================================"

    - name: Login to ACR
      if: ${{ steps.dockerfile-check.outputs.exists == 'true' }}
      shell: bash
      run: |
        az acr login --name alramzregistry

    - name: Build Docker Image
      if: ${{ steps.dockerfile-check.outputs.exists == 'true' }}
      shell: bash
      run: |
        docker build \
          -t ${{ inputs.acr-name }}/${{ inputs.service-name }}:$IMAGE_TAG \
          ./services/${{ inputs.service-name }}

    - name: Push Docker Image
      if: ${{ steps.dockerfile-check.outputs.exists == 'true' }}
      shell: bash
      run: |
        docker push ${{ inputs.acr-name }}/${{ inputs.service-name }}:$IMAGE_TAG
