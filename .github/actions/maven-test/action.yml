name: Maven Test

description: Run Maven tests for a Spring Boot service

inputs:
  service-name:
    description: Service directory name
    required: true
  github-token:
    description: 'GitHub token for authentication'
    required: true
    type: string

runs:
  using: composite

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Maven local repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Configure Maven settings
      shell: bash
      run: |
        echo "========================================"
        echo "DEBUG: Configuring Maven settings for GitHub Packages"
        echo "========================================"
        mkdir -p $HOME/.m2
        cat > $HOME/.m2/settings.xml <<EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>github</id>
              <username>x-access-token</username>
              <password>${{ inputs.github-token }}</password>
            </server>
          </servers>
        </settings>
        EOF
        echo "Maven settings configured."
        echo "========================================"

    - name: Install BOM locally
      shell: bash
      run: |
        echo "========================================"
        echo "DEBUG: Installing alramz-common-bom locally"
        echo "========================================"
        cd services/alramz-common-bom
        mvn -B install -DskipTests
        echo "========================================"
        echo "SUCCESS: BOM installed locally"
        echo "========================================"

    - name: Run Maven Tests
      shell: bash
      run: |
        cd services/${{ inputs.service-name }}

        echo "Running tests for ${{ inputs.service-name }}"

        mvn -B -s $HOME/.m2/settings.xml clean test
