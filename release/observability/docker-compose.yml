# Local observability stack: logs -> Loki, traces -> Tempo OR Jaeger, Grafana on top.
# Pick the trace backend with COMPOSE_PROFILES (both accept OTLP on 4317/4318, so services need no change):
#   COMPOSE_PROFILES=tempo  docker compose -f release/observability/docker-compose.yml up -d
#   COMPOSE_PROFILES=jaeger docker compose -f release/observability/docker-compose.yml up -d
# Retention: TRACE_RETENTION (default 72h), LOG_RETENTION (default 168h), METRICS_RETENTION (default 15d). Data lives in named volumes.
name: alramz-observability

services:
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOG_RETENTION: ${LOG_RETENTION:-168h}
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"   # OTLP logs: http://localhost:3100/otlp/v1/logs
    restart: unless-stopped

  tempo:
    profiles: ["tempo"]
    image: grafana/tempo:2.8.2
    user: "0"                   # named volume is root-owned; tempo image runs as 10001 otherwise
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      TRACE_RETENTION: ${TRACE_RETENTION:-72h}
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  jaeger:
    profiles: ["jaeger"]
    image: jaegertracing/all-in-one:1.56
    user: "0"                   # badger needs write access to the root-owned named volume
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_SPAN_STORE_TTL: ${TRACE_RETENTION:-72h}
    volumes:
      - jaeger_data:/badger
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-15d}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # services run on the host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      TRACING_BACKEND: ${COMPOSE_PROFILES:-tempo}   # datasource uid that log lines link their trace_id to
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in release/observability/.env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  loki_data:
  tempo_data:
  jaeger_data:
  grafana_data:
  prometheus_data:
