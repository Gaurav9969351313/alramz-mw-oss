name: alramz-platform

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: alramz-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alramz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE}
    container_name: alramz-redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - alramz-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --save "" --appendonly no

  data-validation-service:
    image: ${REGISTRY_URL}/${REGISTRY_NAMESPACE}/data-validation-service:${DATA_VALIDATION_SERVICE_TAG}
    container_name: alramz-data-validation-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      COMPANY_DATASOURCE_MIDDLEWARE_ENABLED: "true"
      COMPANY_DATASOURCE_MIDDLEWARE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=disable
      COMPANY_DATASOURCE_MIDDLEWARE_USERNAME: ${POSTGRES_USER}
      COMPANY_DATASOURCE_MIDDLEWARE_PLAINPASSWORD: ${POSTGRES_PASSWORD}
      COMPANY_DATASOURCE_MIDDLEWARE_DRIVERCLASSNAME: org.postgresql.Driver
      COMPANY_DATASOURCE_MIDDLEWARE_POSTGRES_SSL: "false"
      COMPANY_DATASOURCE_MIDDLEWARE_STARTUP_VALIDATION_ENABLED: "false"
      COMPANY_DATASOURCE_MIDDLEWARE_POOL_MAXIMUM_POOL_SIZE: "10"
      COMPANY_DATASOURCE_MIDDLEWARE_POOL_MINIMUM_IDLE: "2"
      IBAN_API_KEY: ${IBAN_API_KEY}
      VERIPHONE_API_KEY: ${VERIPHONE_API_KEY}
      ETRADE_BASE_URL: ${ETRADE_BASE_URL}
      ETRADE_CLIENT_ID: ${ETRADE_CLIENT_ID}
      ETRADE_CLIENT_SECRET: ${ETRADE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      CIPHER_PASSWORD: ${CIPHER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - alramz-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  alramz-notification-service:
    image: ${REGISTRY_URL}/${REGISTRY_NAMESPACE}/alramz-notification-service:${NOTIFICATION_SERVICE_TAG}
    container_name: alramz-notification-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:h2:mem:notificationsdb
      SPRING_DATASOURCE_DRIVER_CLASSNAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - alramz-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/api/v1/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alramz-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:5050"
    networks:
      - alramz-network
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: alramz-redisinsight
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    ports:
      - "5540:5540"
    networks:
      - alramz-network
    depends_on:
      redis:
        condition: service_healthy

  seq:
    image: datalust/seq:latest
    container_name: alramz-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_API_KEY: ${SEQ_API_KEY:}
    volumes:
      - seq_data:/var/seq
    ports:
      - "5341:80"
    networks:
      - alramz-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  redisinsight_data:
  seq_data:

networks:
  alramz-network:
    driver: bridge
