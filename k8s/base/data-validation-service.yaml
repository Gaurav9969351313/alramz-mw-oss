apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-validation-service
  namespace: alramz-platform
  labels:
    app: data-validation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-validation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: data-validation-service
    spec:
      restartPolicy: Always
      containers:
        - name: data-validation-service
          image: gauravtalele1994/data-validation-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: alramz-config
            - secretRef:
                name: alramz-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: COMPANY_DATASOURCE_MIDDLEWARE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: POSTGRES_USER
            - name: COMPANY_DATASOURCE_MIDDLEWARE_PLAINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: POSTGRES_PASSWORD
            - name: IBAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: IBAN_API_KEY
            - name: VERIPHONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: VERIPHONE_API_KEY
            - name: ETRADE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: ETRADE_BASE_URL
            - name: ETRADE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: ETRADE_CLIENT_ID
            - name: ETRADE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: ETRADE_CLIENT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: JWT_SECRET
            - name: CIPHER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: CIPHER_PASSWORD
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "0.5"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: data-validation-service
  namespace: alramz-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: data-validation-service