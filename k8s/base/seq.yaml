apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seq-pvc
  namespace: alramz-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: alramz-platform
  labels:
    app: seq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
        - name: seq
          image: datalust/seq:latest
          ports:
            - name: http
              containerPort: 80
            - name: ingest
              containerPort: 5341
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SEQ_API_KEY
              value: ""
          volumeMounts:
            - name: seq-storage
              mountPath: /var/seq
          resources:
            requests:
              cpu: "0.25"
              memory: "256Mi"
            limits:
              cpu: "0.5"
              memory: "512Mi"
      volumes:
        - name: seq-storage
          persistentVolumeClaim:
            claimName: seq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seq
  namespace: alramz-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: ingest
      port: 5341
      targetPort: 5341
      protocol: TCP
  selector:
    app: seq