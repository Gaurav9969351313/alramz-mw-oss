apiVersion: apps/v1
kind: Deployment
metadata:
  name: alramz-notification-service
  namespace: alramz-platform
  labels:
    app: alramz-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alramz-notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: alramz-notification-service
    spec:
      restartPolicy: Always
      containers:
        - name: alramz-notification-service
          image: gauravtalele1994/alramz-notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: alramz-config
            - secretRef:
                name: alramz-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:h2:mem:notificationsdb"
            - name: SPRING_DATASOURCE_DRIVER_CLASSNAME
              value: "org.h2.Driver"
            - name: SPRING_DATASOURCE_USERNAME
              value: "sa"
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
            - name: COMPANY_DATASOURCE_MIDDLEWARE_ENABLED
              value: "false"
            - name: COMPANY_DATASOURCE_BROK_ENABLED
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: JWT_SECRET
            - name: CIPHER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: CIPHER_PASSWORD
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alramz-secrets
                  key: AZURE_CLIENT_SECRET
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "0.5"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: alramz-notification-service
  namespace: alramz-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
  selector:
    app: alramz-notification-service