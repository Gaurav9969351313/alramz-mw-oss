apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alramz-platform-base
  namespace: argocd
spec:
  project: alramz-platform
  source:
    repoURL: https://github.com/Gaurav9969351313/alramz-mw-oss.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: alramz-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m