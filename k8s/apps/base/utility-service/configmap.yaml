apiVersion: v1
kind: ConfigMap
metadata:
  name: utility-service-config
data:
  SPRING_PROFILES_ACTIVE: "docker"
  # dev profile listens on 8083; pin the container port so probes and the Service line up.
  SERVER_PORT: "8080"
  COMPANY_DATASOURCE_MIDDLEWARE_URL: "jdbc:postgresql://postgres:5432/alramzmwdb?sslmode=disable"
  COMPANY_DATASOURCE_MIDDLEWARE_USERNAME: "alramzmw"
  COMPANY_DATASOURCE_MIDDLEWARE_DRIVERCLASSNAME: "org.postgresql.Driver"
  COMPANY_DATASOURCE_MIDDLEWARE_STARTUP_VALIDATION_ENABLED: "false"
  COMPANY_DATASOURCE_MIDDLEWARE_POOL_MAXIMUM_POOL_SIZE: "10"
  COMPANY_DATASOURCE_MIDDLEWARE_POOL_MINIMUM_IDLE: "2"
  # REQUIRED: FinouxProperties.baseUrl is @NotBlank, so the pod will not start until this is set.
  # Uses the relaxed-binding name so it applies in every profile (FINOUX_BASE_URL is only read by dev).
  ADAPTER_FINOUX_BASE_URL: ""
