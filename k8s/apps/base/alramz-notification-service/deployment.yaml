apiVersion: apps/v1
kind: Deployment
metadata:
  name: alramz-notification-service
  labels:
    app: alramz-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alramz-notification-service
  template:
    metadata:
      labels:
        app: alramz-notification-service
    spec:
      containers:
        - name: alramz-notification-service
          image: alramz-notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: alramz-notification-service-config
            - secretRef:
                name: alramz-notification-service-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
