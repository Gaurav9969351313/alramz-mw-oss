apiVersion: apps/v1
kind: Deployment
metadata:
  name: alramz-notification-service
spec:
  replicas: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alramz-notification-service-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_EMAIL_SERVICE_PROVIDER: "MICROSOFT_GRAPH"
---
apiVersion: v1
kind: Service
metadata:
  name: alramz-notification-service
spec:
  type: LoadBalancer
  ports:
    - port: 8082
      targetPort: 8082
