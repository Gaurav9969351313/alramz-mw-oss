apiVersion: apps/v1
kind: Deployment
metadata:
  name: utility-service
spec:
  replicas: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: utility-service-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
---
apiVersion: v1
kind: Service
metadata:
  name: utility-service
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
