apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-data-service
spec:
  replicas: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reference-data-service-config
data:
  SPRING_PROFILES_ACTIVE: "preprod"
---
apiVersion: v1
kind: Service
metadata:
  name: reference-data-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
