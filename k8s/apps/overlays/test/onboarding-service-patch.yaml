apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-service
spec:
  replicas: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onboarding-service-config
data:
  SPRING_PROFILES_ACTIVE: "test"
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
