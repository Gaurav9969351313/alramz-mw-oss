apiVersion: apps/v1
kind: Deployment
metadata:
  name: alramz-notification-service
spec:
  replicas: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alramz-notification-service-config
data:
  SPRING_PROFILES_ACTIVE: "test"
  APP_EMAIL_SERVICE_PROVIDER: "NOOP"
---
apiVersion: v1
kind: Service
metadata:
  name: alramz-notification-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
