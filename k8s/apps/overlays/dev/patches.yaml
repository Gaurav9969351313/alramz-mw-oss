apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-validation-service
spec:
  replicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-validation-service-config
data:
  SPRING_PROFILES_ACTIVE: "dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alramz-notification-service
spec:
  replicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alramz-notification-service-config
data:
  SPRING_PROFILES_ACTIVE: "dev"
  APP_EMAIL_SERVICE_PROVIDER: "NOOP"
---
apiVersion: v1
kind: Service
metadata:
  name: data-validation-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: alramz-notification-service
spec:
  type: NodePort
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 5001
