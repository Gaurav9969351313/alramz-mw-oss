apiVersion: apps/v1
kind: Deployment
metadata:
  name: utility-service
spec:
  replicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: utility-service-config
data:
  SPRING_PROFILES_ACTIVE: "dev"
---
apiVersion: v1
kind: Service
metadata:
  name: utility-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30004
